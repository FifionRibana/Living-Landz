[workspace]
members = [
    "crates/client",
    "crates/server",
    "crates/shared",
    "crates/hex_grid",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["O'Brian"]
license = "MIT"

[workspace.dependencies]
# Bevy 0.17.2 (client)
bevy = { version = "0.17.2", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos",     # Pour le debug drawing
    "png",
    "multi_threaded",  # Important pour performance
] }

# ECS Backend (serveur) - Legion ou Hecs
legion = "0.4"
# Alternative : hecs = "0.10"
log = "0.4"
# Async runtime (serveur)
tokio = { version = "1.42", features = ["full"] }

# Networking
tokio-tungstenite = "0.24"  # WebSocket async avec tokio
tungstenite = "0.24"        # WebSocket
futures = "0.3"
bincode = "1.3"

# Utilitaires partagés
serde = { version = "1.0", features = ["derive"] }
glam = "0.29"               # Compatible avec Bevy 0.17
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"

# Hexagones - Version la plus récente
hexx = { version = "0.19", features = ["serde"] }

# Database (serveur)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true  # Réduit la taille du binaire