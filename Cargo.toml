[workspace]
members = [
    "crates/client",
    "crates/server",
    "crates/shared",
    "crates/hex_grid",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["O'Brian"]
license = "MIT"

[workspace.dependencies]
# Bevy 0.17.2 (client)
bevy = { version = "0.17.2" }

# ECS Backend (serveur) - Legion ou Hecs
legion = "0.4"
# Alternative : hecs = "0.10"
log = "0.4"
# Async runtime (serveur)
tokio = { version = "1.42", features = ["full"] }

# Networking
tokio-tungstenite = "0.28"  # WebSocket async avec tokio
tungstenite = "0.28"        # WebSocket
futures = "0.3"
bincode = "1.3"

# Utilitaires partagés
serde = { version = "1.0", features = ["derive"] }
glam = "0.29"               # Compatible avec Bevy 0.17
rand = "0.9.2"
thiserror = "2.0.17"
anyhow = "1.0"

# Hexagones - Version la plus récente
hexx = { version = "0.22", features = ["serde", "bevy", "algorithms"] }

# Database (serveur)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

url = "2.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true  # Réduit la taille du binaire